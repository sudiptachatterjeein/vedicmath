<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f4b"><title>VedicPrep – Mental maths for Bank, SSC & State exams</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f4b;--paper:#f6f5fb;--card:#fff;--saf:#ff9f1c;--mint:#1f9e8f;--red:#d63a45;--mut:#6b6f8f;--line:#e2e1ee;box-sizing:border-box}
*{box-sizing:inherit}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0 .1rem;font-weight:800}h2{font-size:1.15rem;margin:1.2rem 0 .5rem}
.sub{color:var(--mut);margin:0 0 1rem}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{background:var(--saf);color:var(--ink);border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:800;width:100%;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--ink);color:#fff}.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--ink);color:#fff;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}.stat span{font-size:.75rem;opacity:.8}
.q{font-size:2.4rem;font-weight:800;text-align:center;margin:24px 0 12px;letter-spacing:.5px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);width:100%}
input.ans,textarea{width:100%;font:inherit;font-size:1.6rem;text-align:center;border:2px solid var(--ink);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
textarea{font-size:1rem;text-align:left;height:150px}
.ok{color:var(--mint);font-weight:800}.bad{color:var(--red);font-weight:800}.tip{background:#fff6e5;border-left:4px solid var(--saf);padding:10px 12px;border-radius:8px;margin-top:10px}
.pass{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:150px;overflow:auto;margin:8px 0;user-select:none}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.65;font:inherit;font-size:.8rem;padding:10px 2px;cursor:pointer;border-radius:10px}
nav button.on{opacity:1;background:#ffffff22;font-weight:800}input.pin{font-size:1.2rem;border:2px solid var(--ink);border-radius:10px;padding:10px;width:140px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .2s linear}}
body{background:radial-gradient(1200px 380px at 50% -120px,#e4e1ff,var(--paper) 62%) no-repeat}
.hero{background:linear-gradient(135deg,var(--ink),#3a3f9c);color:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 32px #1b1f4b33;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-44px;top:-44px;width:160px;height:160px;border-radius:50%;background:var(--saf);opacity:.2}
.logo{display:flex;align-items:center;gap:10px}.logo i{font-style:normal;width:42px;height:42px;border-radius:13px;background:var(--saf);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.xpbar{height:10px;background:#ffffff33;border-radius:9px;overflow:hidden;margin-top:10px}.xpbar i{display:block;height:100%;background:var(--saf);border-radius:9px}
.pill{background:#ffffff26;border-radius:999px;padding:4px 10px;font-size:.8rem}
.card{border-radius:18px;box-shadow:0 4px 18px #1b1f4b12}.btn{border-radius:16px;box-shadow:0 6px 16px #ff9f1c55}.btn.alt{box-shadow:0 6px 16px #1b1f4b44}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:22px;max-width:520px;margin:0 auto;box-shadow:0 10px 30px #1b1f4b55}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin:20px 0 8px}
.badge{display:inline-block;margin:4px 6px 0 0;padding:6px 12px;border-radius:999px;font-size:.8rem;background:#ecebf5;color:var(--mut)}.badge.on{background:var(--mint);color:#fff}
</style></head><body><div id="app"></div><div class="foot" id="ft"></div>
<nav id="nav"></nav>
<script>
/* WHITE-LABEL: edit this one block to rebrand the whole app */
const BRAND={name:'VedicPrep',tag:'Mental maths for Bank, SSC and state exams',mark:'V',c1:'#1b1f4b',c2:'#ff9f1c',c3:'#1f9e8f',pin:'1234',goal:30,credit:'Design and code by Sudipta Chatterjee'};
const ADMIN_PIN=BRAND.pin;
const K='vp_log',$=s=>document.querySelector(s),app=$('#app');
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}};
const save=e=>{try{const l=load();l.push(Object.assign({t:Date.now(),d:today()},e));localStorage.setItem(K,JSON.stringify(l))}catch(e){}};
const today=()=>new Date().toLocaleDateString('en-CA'),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const EX={state:{n:'State exams',t:25,l:1},bank:{n:'Bank (IBPS/SBI)',t:18,l:2},ssc:{n:'SSC (CGL/CHSL)',t:15,l:3}};
const T={
tbl:{n:'Tables',tip:'Split one number: 17×8 = 10×8 + 7×8 = 80 + 56.',g:l=>{const a=R(11,[0,20,25,35][l]),b=R(3,[0,9,12,19][l]);return[`${a} × ${b}`,a*b]}},
pct:{n:'Percentage tricks',tip:'Build from 10% and 5%: 15% = 10% + half of it. 12.5% = 1/8, 37.5% = 3/8.',g:l=>{const p=l==1?[5,10,20,25,50]:[5,10,12.5,15,20,25,37.5,40,62.5,75],N=l==1?20*R(1,15):80*R(1,[0,5,12,25][l]),q=p[R(0,p.length-1)];return[`${q}% of ${N}`,q*N/100]}},
sq:{n:'Squares',tip:'Ends in 5: n5² = n×(n+1) then 25 (35² → 3×4=12 → 1225). Near 50 or 100: use base method.',g:l=>{const n=R(11,[0,30,60,99][l]);return[`${n}²`,n*n]}},
cube:{n:'Cubes',tip:'Learn 1–10 cubes cold. Then (a+b)³ split: 13³ = 1000 + 3×100×3 + 3×10×9 + 27 = 2197.',g:l=>{const n=R(2,[0,10,15,25][l]);return[`${n}³`,n**3]}},
m11:{n:'×11 trick',tip:'Add neighbouring digits: 43×11 → 4 | 4+3 | 3 = 473. Carry if the sum passes 9.',g:l=>{const a=l==1?R(12,99):R(101,999);return[`${a} × 11`,a*11]}},
base:{n:'Near-100 multiply',tip:'Deficits from 100: 96×97 → 96−3 = 93 | 4×3 = 12 → 9312. Above 100, add the surplus instead.',g:l=>{const a=l<3?R(88,99):R(101,112),b=l<3?R(88,99):R(101,112);return[`${a} × ${b}`,a*b]}},
root:{n:'Square roots',tip:'Last digit gives the root’s last digit (…4 → 2 or 8). Bracket the tens: 40²=1600, 50²=2500.',g:l=>{const n=R(11,[0,25,35,50][l]);return['√'+n*n,n]}},
fr:{n:'Fraction ↔ %',tip:'Memorise 1/8 = 12.5%, 1/16 = 6.25%, 1/6 = 16.67%. Multiply for k/8.',g:l=>{const k=R(1,7);return[`${k}/8 as %`,12.5*k]}}};
const TIPS=[['Multiply by 5','Halve the number, add a zero (46 × 5 → 23 → 230).'],['Multiply by 9, 99','n×9 = n×10 − n. n×99 = n×100 − n.'],['Percentage swap','8% of 25 = 25% of 8 = 2. Pick the easier side.'],['Successive discount','a% then b% = a + b − ab/100. 20% then 10% = 28% off.'],['Percentage change','Increase x% then decrease x% always leaves a loss of x²/100 %.'],['Squares near 50','(50+d)² = 2500 + 100d + d². 53² = 2500+300+9 = 2809.'],['Divisibility','By 3 or 9: add the digits. By 11: difference of alternate digit sums.'],['Ratio to %','1/7 = 14.28%, 1/9 = 11.11%, 1/11 = 9.09%. Know these for DI sets.']];
const PASS=['The Reserve Bank of India regulates the issue of currency notes and keeps the reserves needed to secure monetary stability in the country. Banks accept deposits from the public and lend the funds to individuals and businesses at a fixed rate of interest.','The Staff Selection Commission conducts competitive examinations to recruit candidates for various posts in ministries and departments of the Government of India. Accuracy and speed in data entry are essential skills for clerical positions.','Digital payments have grown rapidly across the country in recent years. Citizens now use mobile applications to pay bills, transfer money and receive subsidies directly in their bank accounts without visiting a branch.'];
let tab='prac',cfg={ex:'bank',tp:'mix',n:10,mn:20,mm:20,lv:0},S=null,TT=null,M=null,tm=null;
const NAV=[['prac','Practice'],['mock','Mock'],['tips','Tricks'],['type','Typing'],['admin','Admin']];
function nav(){$('#nav').innerHTML=NAV.map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(k){clearInterval(tm);S=null;TT=null;M=null;tab=k;nav();({prac:home,mock:mockSetup,tips:tips,type:typeSetup,admin:admin})[k]()}
const chips=(obj,key,lab)=>Object.entries(obj).map(([k,v])=>`<button class="chip ${cfg[key]==k?'on':''}" onclick="cfg.${key}='${k}';home()">${lab(v)}</button>`).join('');
const LV=['Beginner','Apprentice','Calculator','Speedster','Sharpshooter','Ace','Vedic Master'],need=n=>Math.round(120*(n-1)**1.6);
const xp=()=>load().reduce((a,x)=>a+(x.ty=='t'?x.wpm*3:x.ok*10),0);
function lv(X){let n=1;while(X>=need(n+1))n++;return{n,cur:X-need(n),span:need(n+1)-need(n),t:LV[Math.min(LV.length-1,Math.floor((n-1)/2))]}}
function streak(L){const s=new Set(L.map(x=>x.d)),k=d=>d.toLocaleDateString('en-CA');let n=0,d=new Date();if(!s.has(k(d)))d.setDate(d.getDate()-1);while(s.has(k(d))){n++;d.setDate(d.getDate()-1)}return n}
function tpUp(k,ok,sec){try{const o=JSON.parse(localStorage.getItem('vp_tp')||'{}'),t=o[k]=o[k]||{q:0,ok:0,sec:0};t.q++;t.ok+=ok;t.sec+=sec;localStorage.setItem('vp_tp',JSON.stringify(o))}catch(e){}}
function weak(){try{const o=JSON.parse(localStorage.getItem('vp_tp')||'{}');let b=null,m=2;for(const k in o)if(T[k]&&o[k].q>=5&&o[k].ok/o[k].q<m){m=o[k].ok/o[k].q;b=k}return m<.9?b:null}catch(e){return null}}
function badges(L){const q=L.filter(x=>x.ty!='t').reduce((a,x)=>a+x.n,0),st=streak(L);return[['100 questions',q>=100],['1000 questions',q>=1000],['7-day streak',st>=7],['35 WPM typist',L.some(x=>x.ty=='t'&&x.wpm>=35)],['Mock 80%+',L.some(x=>x.ty=='m'&&x.score/x.max>=.8)],['Perfect round',L.some(x=>x.ty=='p'&&x.ok==x.n)]]}
function home(){const A=load(),L=A.filter(x=>x.d==today()&&x.ty!='t'),q=L.reduce((a,x)=>a+x.n,0),ok=L.reduce((a,x)=>a+x.ok,0),m=Math.round(L.reduce((a,x)=>a+x.secs,0)/60),X=xp(),v=lv(X),st=streak(A),w=weak(),g=Math.min(100,Math.round(q/BRAND.goal*100));
const ch=(a,k,l)=>a.map(n=>`<button class="chip ${cfg[k]==n?'on':''}" onclick="cfg.${k}=${n};home()">${l(n)}</button>`).join('');
app.innerHTML=`<div class="hero"><div class="logo"><i>${BRAND.mark}</i><div><b style="font-size:1.25rem">${BRAND.name}</b><div style="opacity:.75;font-size:.8rem">${BRAND.tag}</div></div></div>
<div class="row" style="margin-top:16px;align-items:center;justify-content:space-between"><div><div style="font-size:.8rem;opacity:.75">Level ${v.n}</div><b style="font-size:1.5rem">${v.t}</b></div><div class="row"><span class="pill">🔥 ${st} day streak</span><span class="pill">${X} XP</span></div></div>
<div class="xpbar"><i style="width:${Math.round(v.cur/v.span*100)}%"></i></div><div style="font-size:.75rem;opacity:.75;margin-top:4px">${v.span-v.cur} XP to level ${v.n+1}</div></div>
<div class="card"><b>Daily goal</b><span class="sub" style="float:right;margin:0">${q} / ${BRAND.goal} questions</span><div class="bar" style="margin:8px 0 12px"><i style="width:${g}%;background:var(--saf)"></i></div>
<div class="stats"><div class="stat"><b>${q}</b><span>questions</span></div><div class="stat"><b>${q?Math.round(ok/q*100):0}%</b><span>accuracy</span></div><div class="stat"><b>${m}</b><span>minutes</span></div></div></div>
${w?`<button class="btn alt" onclick="cfg.tp='${w}';start()">Drill your weakest topic: ${T[w].n}</button>`:''}
<h2>Exam pattern</h2><div class="row">${chips(EX,'ex',v=>v.n)}</div>
<h2>Topic</h2><div class="row">${chips(Object.assign({mix:{n:'Mixed'}},T),'tp',v=>v.n)}</div>
<h2>Difficulty</h2><div class="row">${ch([0,1,2,3],'lv',n=>['Auto','Easy','Medium','Hard'][n])}</div>
<h2>Questions</h2><div class="row">${ch([10,20,30],'n',n=>n)}</div>
<button class="btn" onclick="start()">Start practice</button>
<h2>Badges</h2>${badges(A).map(b=>`<span class="badge ${b[1]?'on':''}">${b[1]?'✓ ':''}${b[0]}</span>`).join('')}`}
function start(){S={i:0,ok:0,w:[],secs:0};next()}
function next(){if(S.i>=cfg.n)return fin();const e=EX[cfg.ex],ks=Object.keys(T),k=cfg.tp=='mix'?ks[R(0,ks.length-1)]:cfg.tp,[q,a]=T[k].g(cfg.lv||e.l);Object.assign(S,{q,a,k,lock:0,t0:Date.now()});
app.innerHTML=`<div class="sub">Question ${S.i+1} of ${cfg.n} · ${T[k].n}</div><div class="bar"><i id="b"></i></div><div class="q">${q}</div>
<input class="ans" id="in" inputmode="decimal" autocomplete="off" placeholder="Answer"><div id="fb"></div><button class="btn alt" id="go" onclick="sub()">Check</button>`;
const el=$('#in');el.focus();el.onkeydown=e=>{if(e.key=='Enter')S.lock?next():sub()};clearInterval(tm);
tm=setInterval(()=>{const l=1-(Date.now()-S.t0)/(e.t*1000);$('#b').style.width=Math.max(0,l*100)+'%';if(l<=0)sub(1)},200)}
function sub(to){if(S.lock)return;S.lock=1;clearInterval(tm);const v=$('#in').value.trim(),s=Math.min((Date.now()-S.t0)/1000,EX[cfg.ex].t);S.secs+=s;
const ok=!to&&v!==''&&Math.abs(parseFloat(v)-S.a)<.01;tpUp(S.k,ok?1:0,s);S.i++;if(ok)S.ok++;else S.w.push([S.q,v||'—',S.a]);
$('#fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'Correct':to?'Time up':'Not quite'} — answer ${S.a}</p><div class="tip">${T[S.k].tip}</div>`;$('#in').disabled=true;
$('#go').textContent=S.i>=cfg.n?'See result':'Next question';$('#go').onclick=next;$('#go').focus()}
function fin(){const x0=xp();save({ty:'p',tp:cfg.tp,ex:cfg.ex,n:cfg.n,ok:S.ok,secs:Math.round(S.secs)});const x1=xp(),up=lv(x1).n>lv(x0).n;
app.innerHTML=`<h1>${S.ok} / ${cfg.n} correct</h1><p class="ok">+${x1-x0} XP${up?' · Level up! You are now level '+lv(x1).n+' ('+lv(x1).t+')':''}</p><p class="sub">${Math.round(S.ok/cfg.n*100)}% accuracy · ${(S.secs/cfg.n).toFixed(1)} s per question</p>
${S.w.length?`<h2>Review</h2><div class="card scroll"><table><tr><th>Question</th><th>You</th><th>Answer</th></tr>${S.w.map(w=>`<tr><td>${w[0]}</td><td class="bad">${w[1]}</td><td class="ok">${w[2]}</td></tr>`).join('')}</table></div>`:'<p class="ok">Perfect round.</p>'}
<button class="btn" onclick="start()">Practice again</button><button class="btn alt" onclick="home()">Change topic</button>`}
function tips(){app.innerHTML=`<h1>Vedic and percentage tricks</h1><p class="sub">Read one, then practise it.</p>`+Object.values(T).map(t=>`<div class="card"><b>${t.n}</b><br>${t.tip}</div>`).join('')+TIPS.map(t=>`<div class="card"><b>${t[0]}</b><br>${t[1]}</div>`).join('')}
const MK={state:[1,.25],bank:[1,.25],ssc:[2,.5]},f=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function mockSetup(){const m=MK[cfg.ex],b=(k,a,l)=>a.map(n=>`<button class="chip ${cfg[k]==n?'on':''}" onclick="cfg.${k}=${n};mockSetup()">${l(n)}</button>`).join('');
app.innerHTML=`<h1>Mock test</h1><p class="sub">Timed full-length test with question palette, mark for review and negative marking.</p>
<h2>Exam pattern</h2><div class="row">${chips(EX,'ex',v=>v.n).replace(/home\(\)/g,'mockSetup()')}</div>
<h2>Questions</h2><div class="row">${b('mn',[20,30,50],n=>n)}</div><h2>Time</h2><div class="row">${b('mm',[10,20,30],n=>n+' min')}</div>
<p class="sub" style="margin-top:12px">+${m[0]} for correct, −${m[1]} for wrong, 0 for skipped. The test submits itself when time ends.</p><button class="btn" onclick="mStart()">Start mock test</button>`}
function mStart(){const ks=Object.keys(T),l=EX[cfg.ex].l;M={mm:cfg.mm,i:0,end:Date.now()+cfg.mm*60000,qs:Array.from({length:cfg.mn},()=>{const k=ks[R(0,ks.length-1)],[q,a]=T[k].g(l);return{q,a,k,v:'',mk:0,sec:0}})};mShow()}
const pal=(x,i)=>(x.mk?'background:#ff9f1c;':x.v!==''?'background:#1f9e8f;color:#fff;':'')+(i==M.i?'border-color:#1b1f4b;border-width:3px':'');
function mSave(){const q=M.qs[M.i],el=$('#in');if(el)q.v=el.value.trim();q.sec+=(Date.now()-M.t0)/1000;M.t0=Date.now()}
function mGo(j){mSave();M.i=Math.max(0,Math.min(M.qs.length-1,j));mShow()}
function mMark(){mSave();M.qs[M.i].mk=!M.qs[M.i].mk;mShow()}
function mShow(){const q=M.qs[M.i];M.t0=Date.now();
app.innerHTML=`<div style="position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:5"><div class="row" style="justify-content:space-between;align-items:center"><b id="mt"></b><button class="chip" onclick="mEnd(1)">Submit test</button></div><div class="bar"><i id="b"></i></div></div>
<div class="sub">Question ${M.i+1} of ${M.qs.length}</div><div class="q">${q.q}</div><input class="ans" id="in" inputmode="decimal" autocomplete="off" placeholder="Answer" value="${q.v}">
<div class="row" style="margin-top:12px"><button class="chip" onclick="mGo(M.i-1)">Previous</button><button class="chip ${q.mk?'on':''}" onclick="mMark()">Mark for review</button><button class="chip" onclick="mGo(M.i+1)">Save and next</button></div>
<h2>Question palette</h2><div class="row">${M.qs.map((x,i)=>`<button class="chip" style="min-width:44px;padding:8px;${pal(x,i)}" onclick="mGo(${i})">${i+1}</button>`).join('')}</div>
<p class="sub">Green: answered. Orange: marked for review. White: not answered.</p>`;
$('#in').onkeydown=e=>{if(e.key=='Enter')mGo(M.i+1)};clearInterval(tm);
const u=()=>{const l=Math.max(0,Math.ceil((M.end-Date.now())/1000)),el=$('#mt');if(!el)return;el.textContent='Time left '+f(l);el.style.color=l<60?'var(--red)':'';$('#b').style.width=l/(M.mm*60)*100+'%';if(l<=0)mEnd()};u();tm=setInterval(u,500)}
function mEnd(c){if(!M)return;if(c&&!confirm('Submit the test now?'))return;clearInterval(tm);mSave();const m=MK[cfg.ex],n=M.qs.length,tp={};let ok=0,wr=0;
M.qs.forEach(x=>{const t=tp[x.k]=tp[x.k]||{n:0,ok:0,sec:0};t.n++;t.sec+=x.sec;if(x.v!==''){if(Math.abs(parseFloat(x.v)-x.a)<.01){ok++;t.ok++;x.r=1}else{wr++;x.r=2}}});
const sc=ok*m[0]-wr*m[1],used=Math.min(M.mm*60,Math.round(M.mm*60-(M.end-Date.now())/1000)),sk=n-ok-wr,qs=M.qs;M=null;
const x0=xp();save({ty:'m',ex:cfg.ex,n,ok,wr,score:sc,max:n*m[0],secs:used});const gain=xp()-x0;qs.forEach(x=>{if(x.v!=='')tpUp(x.k,x.r==1?1:0,x.sec)});
app.innerHTML=`<h1>Score ${sc} / ${n*m[0]}</h1><p class="ok">+${gain} XP</p><p class="sub">${EX[cfg.ex].n} pattern · time used ${f(used)}</p>
<div class="stats"><div class="stat"><b>${ok}</b><span>correct</span></div><div class="stat"><b>${wr}</b><span>wrong</span></div><div class="stat"><b>${sk}</b><span>skipped</span></div></div>
<h2>Topic analysis</h2><div class="card scroll"><table><tr><th>Topic</th><th>Correct</th><th>Avg s/Q</th></tr>${Object.keys(tp).map(k=>`<tr><td>${T[k].n}</td><td>${tp[k].ok}/${tp[k].n}</td><td>${(tp[k].sec/tp[k].n).toFixed(1)}</td></tr>`).join('')}</table></div>
<h2>Review</h2><div class="card scroll"><table><tr><th>Question</th><th>You</th><th>Answer</th></tr>${qs.filter(x=>x.r!=1).map(x=>`<tr><td>${x.q}</td><td class="bad">${x.v||'Skipped'}</td><td class="ok">${x.a}</td></tr>`).join('')||'<tr><td colspan=3>All correct.</td></tr>'}</table></div>
<button class="btn" onclick="mockSetup()">New mock test</button>`}
let tmin=5;
function typeSetup(){app.innerHTML=`<h1>Typing test</h1><p class="sub">Govt exam style: net speed counts only correct words. A common English target is 35 WPM.</p>
<h2>Duration</h2><div class="row">${[1,5,10].map(m=>`<button class="chip ${tmin==m?'on':''}" onclick="tmin=${m};typeSetup()">${m} min</button>`).join('')}</div>
<button class="btn" onclick="tStart()">Start typing test</button>`}
function tStart(){const p=PASS[R(0,2)],txt=(p+' ').repeat(10).trim();TT={p:txt.split(' '),t0:0,dur:tmin*60};
app.innerHTML=`<div class="sub" id="tt">Timer starts when you type.</div><div class="bar"><i id="b"></i></div><div class="pass">${txt}</div>
<textarea id="ta" placeholder="Start typing here" onpaste="return false" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><button class="btn alt" onclick="tEnd()">Finish now</button>`;
$('#ta').focus();$('#ta').oninput=()=>{if(TT.t0)return;TT.t0=Date.now();tm=setInterval(()=>{const e=(Date.now()-TT.t0)/1000,l=TT.dur-e;$('#b').style.width=Math.max(0,l/TT.dur*100)+'%';$('#tt').textContent=Math.max(0,Math.ceil(l))+' s left';if(l<=0)tEnd()},250)}}
function tEnd(){clearInterval(tm);if(!TT)return;const v=$('#ta').value,w=v.trim()?v.trim().split(/\s+/):[],e=Math.max((Date.now()-(TT.t0||Date.now()))/60000,.05);
let err=0;w.forEach((x,i)=>{if(x!=TT.p[i])err++});const gross=v.length/5/e,net=Math.max(0,gross-err/e),acc=w.length?Math.round((w.length-err)/w.length*100):0;
save({ty:'t',n:w.length,secs:Math.round(e*60),wpm:Math.round(net),acc});TT=null;
app.innerHTML=`<h1>${Math.round(net)} net WPM</h1><p class="ok">+${Math.round(net)*3} XP</p><div class="stats"><div class="stat"><b>${Math.round(gross)}</b><span>gross WPM</span></div><div class="stat"><b>${acc}%</b><span>accuracy</span></div><div class="stat"><b>${err}</b><span>wrong words</span></div></div>
<button class="btn" onclick="typeSetup()">Try again</button>`}
function admin(){app.innerHTML=`<h1>Admin</h1><p class="sub">Enter PIN to view usage.</p><input class="pin" id="pin" type="password" inputmode="numeric" placeholder="PIN"> <button class="chip on" onclick="$('#pin').value==ADMIN_PIN?dash():alert('Wrong PIN')">Open</button>`}
function dash(){const L=load(),P=L.filter(x=>x.ty=='p'),Ty=L.filter(x=>x.ty=='t'),Mo=L.filter(x=>x.ty=='m'),days={},tops={};
P.forEach(x=>{const d=days[x.d]=days[x.d]||{s:0,q:0,ok:0,sec:0};d.s++;d.q+=x.n;d.ok+=x.ok;d.sec+=x.secs;const t=tops[x.tp]=tops[x.tp]||{q:0,ok:0,sec:0};t.q+=x.n;t.ok+=x.ok;t.sec+=x.secs});
const best=Ty.reduce((a,x)=>Math.max(a,x.wpm),0),avg=Ty.length?Math.round(Ty.reduce((a,x)=>a+x.wpm,0)/Ty.length):0;
app.innerHTML=`<h1>Usage dashboard</h1><p class="sub">Data from this device. For all learners, connect a database (see deploy notes).</p>
<div class="stats"><div class="stat"><b>${P.length}</b><span>practice sessions</span></div><div class="stat"><b>${Ty.length}</b><span>typing tests</span></div><div class="stat"><b>${best}/${avg}</b><span>best / avg WPM</span></div></div>
<h2>Daily usage</h2><div class="card scroll"><table><tr><th>Date</th><th>Sessions</th><th>Qs</th><th>Score</th><th>Mins</th><th>s/Q</th></tr>${Object.keys(days).sort().reverse().map(k=>{const d=days[k];return`<tr><td>${k}</td><td>${d.s}</td><td>${d.q}</td><td>${Math.round(d.ok/d.q*100)}%</td><td>${Math.round(d.sec/60)}</td><td>${(d.sec/d.q).toFixed(1)}</td></tr>`}).join('')||'<tr><td colspan=6>No data yet.</td></tr>'}</table></div>
<h2>By topic</h2><div class="card scroll"><table><tr><th>Topic</th><th>Qs</th><th>Score</th><th>s/Q</th></tr>${Object.keys(tops).map(k=>{const t=tops[k];return`<tr><td>${k=='mix'?'Mixed':T[k].n}</td><td>${t.q}</td><td>${Math.round(t.ok/t.q*100)}%</td><td>${(t.sec/t.q).toFixed(1)}</td></tr>`}).join('')}</table></div>
<h2>Mock tests</h2><div class="card scroll"><table><tr><th>Date</th><th>Exam</th><th>Score</th><th>Right/Wrong</th><th>Mins</th></tr>${Mo.slice(-15).reverse().map(x=>`<tr><td>${x.d}</td><td>${EX[x.ex].n}</td><td>${x.score}/${x.max}</td><td>${x.ok}/${x.wr}</td><td>${Math.round(x.secs/60)}</td></tr>`).join('')||'<tr><td colspan=5>No mock tests yet.</td></tr>'}</table></div>
<button class="btn" onclick="csv()">Export CSV</button><button class="btn alt" onclick="confirm('Delete all data on this device?')&&(localStorage.removeItem(K),dash())">Clear data</button>`}
function csv(){const L=load(),h=['d','t','ty','tp','ex','n','ok','secs','wpm','acc','wr','score','max'],c=[h.join(',')].concat(L.map(x=>h.map(k=>x[k]??'').join(','))).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='vedicprep-usage.csv';a.click()}
document.title=BRAND.name+' – '+BRAND.tag;[['--ink',BRAND.c1],['--saf',BRAND.c2],['--mint',BRAND.c3]].forEach(([k,v])=>document.documentElement.style.setProperty(k,v));$('#ft').textContent=BRAND.credit;nav();home();
</script></body></html>
